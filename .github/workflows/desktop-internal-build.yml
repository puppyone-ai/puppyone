name: Desktop Internal Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified bundle to GitHub Releases and Cloudflare R2
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ad-hoc macOS release once
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_tag: ${{ steps.release.outputs.tag }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PUBLIC_DOWNLOAD_ORIGIN: https://downloads.puppyone.ai
      VITE_DESKTOP_CLOUD_API_URL: https://api.puppyone.ai/api/v1
      VITE_DESKTOP_CLOUD_WEB_URL: https://app.puppyone.ai

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify green main source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Internal releases must be built from the main branch." >&2
            exit 1
          fi
          SUCCESSFUL_CI_RUNS="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f head_sha="${GITHUB_SHA}" \
              -f status=completed \
              --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length'
          )"
          if [ "${SUCCESSFUL_CI_RUNS}" -lt 1 ]; then
            echo "Internal releases require a successful CI push run for ${GITHUB_SHA} on main." >&2
            exit 1
          fi

      - name: Resolve immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-desktop-build.mjs \
            --channel internal \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --target macos-arm64 \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install locked dependencies
        run: npm ci

      - name: Test updater monotonicity P0
        run: npm run test:updater-p0

      - name: Verify Internal release version moves forward
        run: >-
          node scripts/verify-desktop-release-version.mjs
          --channel internal
          --candidate-version "${{ steps.release.outputs.version }}"

      - name: Test release transaction and Terminal launcher
        run: >-
          npm test --
          tests/integration/terminal/startup/terminalPreviewLauncher.test.mjs
          tests/integration/release/build-identity/desktopReleaseMetadata.test.mjs
          tests/architecture/release/build-identity/macosReleasePolicy.test.mjs

      - name: Build ad-hoc macOS package
        run: npm run dist:mac:prepared

      - name: Verify packaged Internal Build Identity
        run: node scripts/verify-packaged-desktop-build.mjs

      - name: Build checksum-pinned Terminal launcher
        id: preview
        env:
          ARCH: ${{ steps.release.outputs.arch }}
          INTERNAL_ID: ${{ steps.release.outputs.internal_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="puppyone-${VERSION}-${ARCH}.zip"
          R2_PREFIX="desktop/internal/mac/${RELEASE_TAG}"
          if [ ! -f "release/${ARCHIVE_NAME}" ]; then
            echo "Expected release/${ARCHIVE_NAME}, but it was not built." >&2
            exit 1
          fi
          npm run package:terminal-preview -- \
            --arch "${ARCH}" \
            --archive "release/${ARCHIVE_NAME}" \
            --archive-url "${PUBLIC_DOWNLOAD_ORIGIN}/${R2_PREFIX}/${ARCHIVE_NAME}" \
            --build-info "generated/desktop-build-info.json" \
            --package-version "${VERSION}" \
            --release-tag "${RELEASE_TAG}"

          set -- artifacts/terminal-preview/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one Terminal preview package." >&2
            exit 1
          fi
          echo "package_name=$(basename "$1")" >> "${GITHUB_OUTPUT}"

      - name: Write internal release notes
        env:
          PREVIEW_PACKAGE: ${{ steps.preview.outputs.package_name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "Ad-hoc signed internal macOS build."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "R2 version prefix: desktop/internal/mac/${RELEASE_TAG}"
            echo
            echo "This build is not Developer ID signed or notarized. Use it for technical preview testing only."
            echo
            echo "Terminal preview command:"
            echo '```bash'
            echo "npm exec --yes --package=${PUBLIC_DOWNLOAD_ORIGIN}/desktop/internal/mac/${RELEASE_TAG}/${PREVIEW_PACKAGE} -- puppyone-preview"
            echo '```'
          } > artifacts/release-notes.md

      - name: Create self-describing release bundle
        env:
          ARCH: ${{ steps.release.outputs.arch }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for pattern in release/puppyone-*.dmg release/puppyone-*.zip release/puppyone-*.blockmap release/internal-mac.yml artifacts/terminal-preview/*.tgz; do
            for file in $pattern; do
              [ -f "${file}" ] && assets+=(--asset "${file}")
            done
          done
          node scripts/create-desktop-release-bundle.mjs create \
            --bundle artifacts/desktop-release-bundle \
            --build-info generated/desktop-build-info.json \
            --channel internal \
            --tag "${RELEASE_TAG}" \
            --version "${VERSION}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --r2-prefix "desktop/internal/mac/${RELEASE_TAG}" \
            --public-origin "${PUBLIC_DOWNLOAD_ORIGIN}" \
            --published-at "${PUBLISHED_AT}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arch "${ARCH}" \
            --prerelease true \
            --provenance pipeline \
            --developer-id-signed false \
            --notarized false \
            --notes-file artifacts/release-notes.md \
            "${assets[@]}"

      - name: Verify release bundle before handoff
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node scripts/create-desktop-release-bundle.mjs verify \
            --bundle artifacts/desktop-release-bundle \
            --channel internal \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}"

      - name: Attest published binaries and checksums
        if: ${{ inputs.publish_release }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            artifacts/desktop-release-bundle/assets/*
            artifacts/desktop-release-bundle/release.json
            artifacts/desktop-release-bundle/build-info.json
            artifacts/desktop-release-bundle/SHA256SUMS

      - name: Upload build-once release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/desktop-release-bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub and R2 release
    needs: build
    if: ${{ inputs.publish_release }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release-publish.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      channel: internal
      deployment_environment: desktop-internal
      generate_notes: false
      prerelease: true
      publish_github_release: false
      release_name: ${{ needs.build.outputs.release_name }}
      release_tag: ${{ needs.build.outputs.release_tag }}
      verify_tag: false
    secrets: inherit
