name: Desktop Stable Update Feed Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-stable-update-feed-monitor
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shipped Stable update contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify every shipped Stable update feed
        id: update_feed
        run: node scripts/verify-desktop-stable-update-feed.mjs

      - name: Verify Stable latest is the published history head
        id: release_history
        run: >-
          node scripts/verify-desktop-release-version.mjs
          --channel stable
          --require-latest-history-head

      - name: Verify Windows Stable feed when established
        id: windows_update_feed
        shell: bash
        run: |
          set -euo pipefail
          POINTER="https://downloads.puppyone.ai/desktop/stable/windows/x64/nsis/latest/latest.json"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-redirs 0 "${POINTER}")"
          if [ "${STATUS}" = "404" ]; then
            echo "state=not-published" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${STATUS}" != "200" ]; then
            echo "Windows Stable pointer returned HTTP ${STATUS}." >&2
            exit 1
          fi
          node scripts/verify-desktop-windows-update-feed.mjs
          node scripts/verify-desktop-release-version.mjs \
            --channel stable \
            --require-latest-history-head \
            --catalog-url "https://downloads.puppyone.ai/desktop/stable/windows/x64/nsis/releases.json" \
            --latest-pointer-url "${POINTER}"
          echo "state=verified" >> "${GITHUB_OUTPUT}"

      - name: Summarize update feed health
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.update_feed.outcome }}
          HISTORY_OUTCOME: ${{ steps.release_history.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows_update_feed.outcome }}
          WINDOWS_STATE: ${{ steps.windows_update_feed.outputs.state }}
        run: |
          {
            echo "### Desktop Stable update feed"
            echo
            echo "- Result: ${VERIFY_OUTCOME}"
            echo "- Monotonic release history: ${HISTORY_OUTCOME}"
            echo "- Machine update origin: https://updates.puppyone.ai/desktop/stable/mac/latest/stable-mac.yml"
            echo "- Public release pointer: https://downloads.puppyone.ai/desktop/stable/mac/latest/latest.json"
            echo "- Windows feed: ${WINDOWS_OUTCOME} (${WINDOWS_STATE:-unknown})"
            echo "- Windows machine update origin: https://updates.puppyone.ai/desktop/stable/windows/x64/nsis/latest/stable.yml"
            echo "- Windows public release pointer: https://downloads.puppyone.ai/desktop/stable/windows/x64/nsis/latest/latest.json"
          } >> "${GITHUB_STEP_SUMMARY}"
