name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - qubits

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-desktop-targets:
    name: Resolve Desktop targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve target manifest
        id: targets
        shell: bash
        run: echo "matrix=$(node scripts/print-desktop-target-matrix.mjs --scope contracts)" >> "${GITHUB_OUTPUT}"

  platform-contracts:
    name: Platform contracts (${{ matrix.id }})
    needs: resolve-desktop-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-desktop-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test updater routing and monotonicity P0
        run: npm run test:updater-p0

      - name: Pre-release Checks — platform
        run: npm run check:release -- --group platform

      - name: Retain pre-release check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-${{ matrix.id }}
          path: |
            artifacts/release-checks/
            artifacts/tests/
          retention-days: 7

  source-checks:
    name: Pre-release Checks (source)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch readability comparison commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Never fall back to HEAD/HEAD^: that could compare a baseline to
          # itself or omit earlier commits in a multi-commit push.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo "A valid PR base or pre-push commit is required." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          echo "READABILITY_BASE=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Readability and dependency gates
        run: |
          npm run lint
          npm run check:dependencies
          npm run check:readability-baselines
          npm run test:readability-gates

      - name: Pre-release Checks — source
        run: npm run check:release -- --group source

      - name: Retain pre-release check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-source
          path: |
            artifacts/release-checks/
            artifacts/tests/
          retention-days: 7

  app-checks:
    name: Pre-release Checks (app, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    # The checks take about ten minutes; the rest covers one slow package
    # download on a cold Linux cache.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The runner's Ubuntu mirror has stalled for 19 minutes and crawled
      # through the 61 MB CJK font package. Keep the downloaded packages, so
      # most runs install without touching the mirror's package pool.
      - name: Restore Linux package downloads
        if: runner.os == 'Linux'
        id: apt-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-apt-archives
          key: ci-apt-${{ runner.os }}-${{ runner.arch }}-xvfb-fonts-noto-cjk-v1

      - name: Prepare Linux display and multilingual fonts
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          archives="$HOME/.cache/ci-apt-archives"
          mkdir -p "$archives/partial"
          # Give up on a silent connection and retry instead of waiting.
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            -o "Dir::Cache::archives=$archives")
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes xvfb fonts-noto-cjk
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Save Linux package downloads
        if: runner.os == 'Linux' && steps.apt-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-apt-archives
          key: ${{ steps.apt-downloads.outputs.cache-primary-key }}

      - name: Pre-release Checks — app
        run: npm run check:release -- --group app

      - name: Retain pre-release check results and renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-app-${{ matrix.os }}
          path: |
            artifacts/release-checks/
            artifacts/tests/
          retention-days: 7

  windows-package:
    name: Windows x64 NSIS package smoke
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_DESKTOP_CLOUD_API_URL: https://api.puppyone.ai/api/v1
      VITE_DESKTOP_CLOUD_WEB_URL: https://try.puppyone.ai

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve Windows package identity
        shell: pwsh
        run: >-
          node scripts/prepare-desktop-build.mjs
          --channel dev
          --commit "$env:GITHUB_SHA"
          --target windows-x64

      - name: Build and verify unsigned NSIS package
        run: npm run prepare:windows:release && npm run package:windows:release

      - name: Smoke-test silent NSIS installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "release/puppyone-*-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows NSIS installer was not produced." }
          $installDirectory = Join-Path $env:RUNNER_TEMP "PuppyOneWindowsSmoke"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDirectory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $installDirectory "PuppyOne Development.exe"))) {
            throw "Installed PuppyOne Development executable was not found."
          }

      - name: Retain Windows installer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-nsis-smoke
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            artifacts/release-checks/
            artifacts/tests/
          if-no-files-found: warn
          retention-days: 7

  cloud-email-sign-in:
    # A person signs in to this Desktop commit with email through the paired
    # Cloud Web (qubits <-> qubits, main <-> main): real Main auth service, the
    # Web's release image served as deployed, local auth-only Supabase. Cloud
    # owns the check so both repositories run the same one. Keep the @ref and
    # harness_ref equal.
    name: Cloud email sign-in
    uses: puppyone-ai/puppyone-cloud/.github/workflows/desktop-login-e2e.yml@qubits
    with:
      desktop_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      desktop_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      cloud_ref: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'qubits' }}
      harness_ref: qubits

  build:
    # Preserve the protected branch's existing required check name.
    name: Build
    if: always()
    needs: [source-checks, app-checks, platform-contracts, windows-package, cloud-email-sign-in]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pre-release check group
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          APP_RESULT: ${{ needs.app-checks.result }}
          PLATFORM_RESULT: ${{ needs.platform-contracts.result }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package.result }}
          CLOUD_EMAIL_SIGN_IN_RESULT: ${{ needs.cloud-email-sign-in.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$APP_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$WINDOWS_PACKAGE_RESULT" = success
          test "$CLOUD_EMAIL_SIGN_IN_RESULT" = success
