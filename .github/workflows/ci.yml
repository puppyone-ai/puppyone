name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-desktop-targets:
    name: Resolve Desktop targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve target manifest
        id: targets
        shell: bash
        run: echo "matrix=$(node scripts/print-desktop-target-matrix.mjs --scope contracts)" >> "${GITHUB_OUTPUT}"

  platform-contracts:
    name: Platform contracts (${{ matrix.id }})
    needs: resolve-desktop-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-desktop-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Pre-release Checks — platform
        run: npm run check:release -- --group platform

      - name: Retain pre-release check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-${{ matrix.id }}
          path: artifacts/release-checks/
          retention-days: 7

  source-checks:
    name: Pre-release Checks (source)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-release Checks — source
        run: npm run check:release -- --group source

      - name: Retain pre-release check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-source
          path: artifacts/release-checks/
          retention-days: 7

  app-checks:
    name: Pre-release Checks (app)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare Linux display and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb fonts-noto-cjk

      - name: Pre-release Checks — app
        run: npm run check:release -- --group app

      - name: Retain pre-release check results and renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checks-app
          path: artifacts/release-checks/
          retention-days: 7

  build:
    # Preserve the protected branch's existing required check name.
    name: Build
    if: always()
    needs: [source-checks, app-checks, platform-contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pre-release check group
        env:
          SOURCE_RESULT: ${{ needs.source-checks.result }}
          APP_RESULT: ${{ needs.app-checks.result }}
          PLATFORM_RESULT: ${{ needs.platform-contracts.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$APP_RESULT" = success
          test "$PLATFORM_RESULT" = success
