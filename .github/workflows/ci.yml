name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve-desktop-targets:
    name: Resolve Desktop targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve target manifest
        id: targets
        shell: bash
        run: echo "matrix=$(node scripts/print-desktop-target-matrix.mjs --scope contracts)" >> "${GITHUB_OUTPUT}"

  platform-contracts:
    name: Platform contracts (${{ matrix.id }})
    needs: resolve-desktop-targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-desktop-targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test target contracts
        run: npm run test:desktop-platform-contracts

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_DESKTOP_CLOUD_API_URL: https://api.puppyone.ai/api/v1
      VITE_DESKTOP_CLOUD_WEB_URL: https://app.puppyone.ai

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test updater monotonicity P0
        run: npm run test:updater-p0:coverage

      - name: Test
        run: npm test

      - name: Test MDI focus continuity in Chromium
        env:
          # npm-installed Electron cannot provide a root-owned SUID sandbox on
          # GitHub-hosted runners. Limit the test-only fallback to this local
          # fixture instead of weakening the application or the whole CI job.
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum npm run smoke:markdown-pane-focus-continuity

      - name: Build
        run: npm run build

      - name: Install fonts for multilingual renderer fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Test Agent submission and viewport in Electron
        timeout-minutes: 2
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          PUPPYONE_AGENT_RENDER_ARTIFACT_DIR: artifacts/agent-renderer/viewport
        run: xvfb-run --auto-servernum node scripts/run-agent-render-stability-smoke.mjs

      - name: Test Agent tool rendering and failure isolation in Electron
        timeout-minutes: 2
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          PUPPYONE_AGENT_TOOL_ARTIFACT_DIR: artifacts/agent-renderer/tools
        run: xvfb-run --auto-servernum node scripts/run-agent-tool-stability-smoke.mjs

      - name: Retain Agent renderer verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-renderer-verification
          path: artifacts/agent-renderer
          if-no-files-found: ignore
          retention-days: 7

      - name: Test Terminal P0 lifecycle and split identity in Electron
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum npm run smoke:terminal-p0

      - name: Test representative Appearance matrix in Chromium
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum npm run smoke:appearance-visual

      - name: Test project-owned sessions in Electron
        timeout-minutes: 3
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run --auto-servernum node_modules/.bin/electron scripts/smoke-project-sessions.mjs
