name: Whiteboard release diagnostics

on:
  push:
    branches: [codex/qa-whiteboard-0.4.4]

permissions:
  contents: read

jobs:
  whiteboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes xvfb fonts-noto-cjk
      - run: npm ci
      - run: npm run check:release -- --check whiteboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: whiteboard-diagnostics
          path: artifacts/release-checks/
          retention-days: 3
