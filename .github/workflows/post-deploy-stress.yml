name: Post-deploy Stress (Bundled Exists Race)

# Smoke-stress the deployed backend immediately after a release to
# verify the bundled-object exists_many race (commit 986c540d) stays
# closed. Empirical pre-fix hit rate was 0/15 to 1/3 depending on
# Supabase replica state; post-fix it should be 0/N. Drift here means
# the fix regressed or a NEW concurrency window opened.
#
# Triggers:
#   - workflow_dispatch (manual) — operator runs after each prod deploy
#   - schedule (daily 04:00 UTC) — catches slow regressions across
#                                  Supabase / S3 backend changes the
#                                  app code itself can't see
#
# Required secrets:
#   QUBITS_TOKEN — a long-lived user JWT for the test account that
#                  has at least one writable project. The script
#                  creates a fresh project per iteration and deletes
#                  it; no test data persists.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Stress iterations (default 30)'
        required: false
        default: '30'
      api_url:
        description: 'Override deploy URL'
        required: false
        default: 'https://qubits-api.puppyone.ai'
  schedule:
    # 04:00 UTC daily — low-traffic window
    - cron: '0 4 * * *'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install backend deps (scripts only)
        working-directory: backend
        run: uv sync

      - name: Run stress
        working-directory: backend
        env:
          QUBITS_TOKEN: ${{ secrets.QUBITS_TOKEN }}
          PUPPYONE_API_URL: ${{ github.event.inputs.api_url || 'https://qubits-api.puppyone.ai' }}
        run: |
          ITERS="${{ github.event.inputs.iterations || '30' }}"
          uv run python scripts/railway_smoke.py --stress "$ITERS"

      - name: Run 17-step canonical smoke
        working-directory: backend
        env:
          QUBITS_TOKEN: ${{ secrets.QUBITS_TOKEN }}
          PUPPYONE_API_URL: ${{ github.event.inputs.api_url || 'https://qubits-api.puppyone.ai' }}
        run: uv run python scripts/railway_smoke.py
