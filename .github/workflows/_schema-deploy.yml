name: Reusable Schema Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Protected GitHub environment name
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-schema:
    name: Deploy schema to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: database-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGDATABASE: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "2.107.0"

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Validate required deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?supabase_access_token is required}"
          : "${SUPABASE_DB_PASSWORD:?supabase_db_password is required}"
          : "${SUPABASE_PROJECT_ID:?supabase_project_id is required}"
          : "${PGDATABASE:?database_url is required}"

          case "$PGDATABASE" in
            postgresql://*@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/*|\
            postgres://*@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/*|\
            postgresql://postgres.${SUPABASE_PROJECT_ID}:*@*.pooler.supabase.com:5432/*|\
            postgres://postgres.${SUPABASE_PROJECT_ID}:*@*.pooler.supabase.com:5432/*)
              ;;
            *)
              echo "::error::database_url must be the protected project's direct or session-pooler URL."
              exit 1
              ;;
          esac

      - name: Link protected Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending schema plan
        run: supabase db push --dry-run

      - name: Apply pending schema migrations
        id: push
        shell: bash
        run: |
          set -uo pipefail
          set +e
          supabase db push 2>&1 | tee /tmp/schema-push.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -q "DATA_MIGRATION_REQUIRED:" /tmp/schema-push.log; then
              migration_id=$(grep -oE 'DATA_MIGRATION_REQUIRED:[0-9A-Za-z_]+' /tmp/schema-push.log | head -n1 | cut -d: -f2)
              {
                echo "## Schema deployment paused safely"
                echo
                echo "Contract migration requires data migration: \`$migration_id\`."
                echo "Run the protected Data Migration workflow, then re-run this deployment."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          fi

      - name: Run database smoke contracts
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/smoke_test_triggers.sql

      - name: Fail on post-deploy schema drift
        shell: bash
        run: |
          set -euo pipefail
          if ! diff_output=$(supabase db diff --linked 2>&1); then
            echo "::error::Could not evaluate post-deploy schema drift."
            echo "$diff_output"
            exit 1
          fi
          if [ -n "$diff_output" ] && ! grep -q "No schema changes found" <<< "$diff_output"; then
            echo "::error::$TARGET_ENVIRONMENT database has schema drift"
            echo "$diff_output"
            exit 1
          fi

      - name: Publish schema attestation
        shell: bash
        run: |
          set -euo pipefail
          bundle_checksum=$(git ls-files 'supabase/migrations/*.sql' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          {
            echo "## Database schema attestation"
            echo
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Migration bundle SHA-256: $bundle_checksum"
            echo
            echo '```text'
            supabase migration list --linked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
