name: Deploy Schema to Production

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/smoke_test_triggers.sql"
      - ".github/workflows/_schema-deploy.yml"
      - ".github/workflows/migrate-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: production
