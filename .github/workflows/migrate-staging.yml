name: Deploy Database to Qubits

on:
  push:
    branches:
      - qubits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_ref:
    name: Validate protected staging source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce qubits branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/qubits" ]; then
            echo "::error::Staging database releases must run from the qubits branch."
            exit 1
          fi

  resolve_data_release:
    name: Resolve staged data release
    if: github.event_name == 'workflow_dispatch'
    needs: validate_ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migration_id: ${{ steps.release.outputs.migration_id }}
      repair_migration_id: ${{ steps.release.outputs.repair_migration_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate staged migration pointer
        id: release
        shell: bash
        run: |
          set -euo pipefail
          request="supabase/releases/staging-data-migration.json"
          migration_id=$(jq -er '.migration_id | select(type == "string")' "$request")
          case "$migration_id" in
            ''|*[!0-9A-Za-z_]*)
              echo "::error::Invalid staging data migration ID."
              exit 1
              ;;
          esac
          if [ ! -d "supabase/data_migrations/$migration_id" ]; then
            echo "::error::Staged data migration artifact does not exist."
            exit 1
          fi
          repair_migration_id=$(jq -er '.repair_migration_id // "" | select(type == "string")' "$request")
          if [ -n "$repair_migration_id" ]; then
            case "$repair_migration_id" in
              *[!0-9A-Za-z_]*)
                echo "::error::Invalid staged repair data migration ID."
                exit 1
                ;;
            esac
            if [ ! -d "supabase/data_migrations/$repair_migration_id" ]; then
              echo "::error::Staged repair data migration artifact does not exist."
              exit 1
            fi
          fi
          echo "migration_id=$migration_id" >> "$GITHUB_OUTPUT"
          echo "repair_migration_id=$repair_migration_id" >> "$GITHUB_OUTPUT"

  deploy_push:
    name: Deploy staging schema after qubits merge
    if: github.event_name == 'push'
    needs: validate_ref
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: staging

  prepare_schema:
    name: Apply compatible schema before staged data migration
    if: github.event_name == 'workflow_dispatch'
    needs: resolve_data_release
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: staging
      allow_data_migration_pause: true

  validate_schema_pause:
    name: Match schema guard to staged data migration
    if: github.event_name == 'workflow_dispatch'
    needs:
      - prepare_schema
      - resolve_data_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MIGRATION_ID: ${{ needs.resolve_data_release.outputs.migration_id }}
      REQUIRED_MIGRATION_ID: ${{ needs.prepare_schema.outputs.required_data_migration_id }}
    steps:
      - name: Reject a mismatched contract guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REQUIRED_MIGRATION_ID" ] && [ "$REQUIRED_MIGRATION_ID" != "$EXPECTED_MIGRATION_ID" ]; then
            echo "::error::Schema requires $REQUIRED_MIGRATION_ID, but the staged release points to $EXPECTED_MIGRATION_ID."
            exit 1
          fi

  repair_run:
    name: Run staged repair before the staged data migration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.resolve_data_release.outputs.repair_migration_id != ''
    needs:
      - validate_schema_pause
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.repair_migration_id }}
      operation: run

  data_plan:
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      needs.validate_schema_pause.result == 'success' &&
      needs.resolve_data_release.result == 'success' &&
      (needs.repair_run.result == 'success' || needs.repair_run.result == 'skipped')
    needs:
      - validate_schema_pause
      - repair_run
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: plan

  data_run:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - data_plan
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: run

  data_verify:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - data_run
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: verify

  deploy_after_data:
    name: Deploy staging schema after data migration
    if: github.event_name == 'workflow_dispatch'
    needs: data_verify
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: staging
