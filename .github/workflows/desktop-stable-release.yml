name: Desktop Stable Release

on:
  workflow_dispatch:
    inputs:
      promotion_source_tag:
        description: Exact installed and approved Internal candidate tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed and notarized macOS release once
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: desktop-signing
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_tag: ${{ steps.release.outputs.tag }}
    env:
      PUBLIC_DOWNLOAD_ORIGIN: https://downloads.puppyone.ai
      VITE_DESKTOP_CLOUD_API_URL: https://api.puppyone.ai/api/v1
      VITE_DESKTOP_CLOUD_WEB_URL: https://app.puppyone.ai

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Validate stable tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Stable tag ${GITHUB_REF_NAME} must exactly match package version ${EXPECTED_TAG}." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "Release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi
          node scripts/prepare-desktop-build.mjs \
            --channel stable \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --expected-tag "${GITHUB_REF_NAME}" \
            --target macos-arm64 \
            --github-output "${GITHUB_OUTPUT}"

      - name: Install locked dependencies without deployment secrets
        run: npm ci

      - name: Test updater monotonicity P0
        run: npm run test:updater-p0

      - name: Verify Stable release version moves forward
        run: >-
          node scripts/verify-desktop-release-version.mjs
          --channel stable
          --candidate-version "${{ steps.release.outputs.version }}"

      - name: Test release transaction and Terminal launcher
        run: >-
          npm test --
          tests/integration/terminal/startup/terminalPreviewLauncher.test.mjs
          tests/integration/release/build-identity/desktopReleaseMetadata.test.mjs
          tests/architecture/release/build-identity/macosReleasePolicy.test.mjs

      - name: Verify exact Internal promotion source
        id: promotion
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PUPPYONE_INTERNAL_RELEASE_TOKEN: ${{ secrets.PUPPYONE_INTERNAL_RELEASE_TOKEN }}
        run: |
          node scripts/verify-stable-promotion-source.mjs \
            --catalog-url "https://downloads.puppyone.ai/desktop/internal/catalog/releases.json" \
            --base-version "${{ steps.release.outputs.base_version }}" \
            --commit "${GITHUB_SHA}" \
            --source-tag "${{ inputs.promotion_source_tag }}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Stage pinned OpenCode runtime without deployment secrets
        env:
          PLATFORM_KEY: ${{ steps.release.outputs.target_runtime_key }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('vendor/opencode/runtime-manifest.json', 'utf8')).runtimeRelease.version")"
          ARCHIVE="$(node -e "const m=require('./vendor/opencode/runtime-manifest.json'); const a=m.artifacts[process.argv[1]]; if(!a) process.exit(2); process.stdout.write(a.archive)" "${PLATFORM_KEY}")"
          DOWNLOAD="${RUNNER_TEMP}/${ARCHIVE}"
          curl --fail --location --retry 3 --output "${DOWNLOAD}" \
            "https://github.com/anomalyco/opencode/releases/download/v${VERSION}/${ARCHIVE}"
          npm run stage:opencode-runtime -- "${DOWNLOAD}"

      - name: Prepare release application without deployment secrets
        run: npm run prepare:mac:release

      - name: Sign, notarize, and verify release package
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          PUPPYONE_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            umask 077
            printf '%s' "${APPLE_API_KEY_BASE64}" | /usr/bin/base64 -D > "${api_key_path}"
            export APPLE_API_KEY="${api_key_path}"
            trap 'rm -f "${api_key_path}"' EXIT
          fi
          npm run package:mac:release

      - name: Write stable release preface
        env:
          PROMOTION_SOURCE_TAG: ${{ steps.promotion.outputs.promotion_source_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "Signed and notarized PuppyOne Desktop release."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Promoted Internal release: ${PROMOTION_SOURCE_TAG}"
            echo "R2 version prefix: desktop/stable/mac/${RELEASE_TAG}"
            echo
            echo "Every attached binary is also mirrored at downloads.puppyone.ai with matching SHA-256 metadata."
          } > artifacts/release-notes.md

      - name: Create self-describing stable release bundle
        env:
          ARCH: ${{ steps.release.outputs.arch }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PROMOTION_SOURCE_TAG: ${{ steps.promotion.outputs.promotion_source_tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          for pattern in release/puppyone-*.dmg release/puppyone-*.zip release/puppyone-*.blockmap release/stable-mac.yml; do
            for file in $pattern; do
              [ -f "${file}" ] && assets+=(--asset "${file}")
            done
          done
          node scripts/create-desktop-release-bundle.mjs create \
            --bundle artifacts/desktop-release-bundle \
            --build-info generated/desktop-build-info.json \
            --channel stable \
            --tag "${RELEASE_TAG}" \
            --version "${VERSION}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --r2-prefix "desktop/stable/mac/${RELEASE_TAG}" \
            --public-origin "${PUBLIC_DOWNLOAD_ORIGIN}" \
            --published-at "${PUBLISHED_AT}" \
            --promotion-source-tag "${PROMOTION_SOURCE_TAG}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arch "${ARCH}" \
            --prerelease false \
            --provenance pipeline \
            --developer-id-signed true \
            --notarized true \
            --notes-file artifacts/release-notes.md \
            "${assets[@]}"

      - name: Verify stable release bundle before handoff
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node scripts/create-desktop-release-bundle.mjs verify \
            --bundle artifacts/desktop-release-bundle \
            --channel stable \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}"

      - name: Attest stable binaries and checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            artifacts/desktop-release-bundle/assets/*
            artifacts/desktop-release-bundle/release.json
            artifacts/desktop-release-bundle/build-info.json
            artifacts/desktop-release-bundle/SHA256SUMS

      - name: Upload build-once stable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/desktop-release-bundle
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish canonical GitHub and R2 release
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release-publish.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      channel: stable
      deployment_environment: desktop-stable
      generate_notes: true
      prerelease: false
      publish_github_release: true
      release_name: ${{ needs.build.outputs.release_name }}
      release_tag: ${{ needs.build.outputs.release_tag }}
      verify_tag: true
    secrets: inherit
