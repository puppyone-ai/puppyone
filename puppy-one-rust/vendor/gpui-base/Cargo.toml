[package]
edition = "2024"
name = "gpui-base"
version = "0.8.0"
build = false
exclude = ["examples/"]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
homepage = "https://gpui-kit.com"
documentation = "https://docs.rs/gpui-base"
readme = "README.md"
keywords = [
    "desktop",
    "gpui",
    "ui",
    "foundation",
]
license = "Apache-2.0"
repository = "https://github.com/longbridge/gpui-kit"
resolver = "2"

[features]
decimal = ["dep:rust_decimal"]
gpui-fast = ["dep:gpui-fast"]
inspector = [
    "gpui_macros/inspector",
    "gpui/inspector",
    "gpui-fast?/inspector",
]
test-support = [
    "gpui/test-support",
    "gpui-fast?/test-support",
]

[lib]
name = "gpui_base"
path = "src/lib.rs"
doctest = false

[[test]]
name = "element_ext"
path = "tests/element_ext.rs"

[[test]]
name = "text_host"
path = "tests/text_host.rs"

[[bench]]
name = "motion"
path = "benches/motion.rs"
harness = false

[[bench]]
name = "text_view_scroll"
