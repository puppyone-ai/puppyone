[package]
name = "puppy-one-rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
url = "2.5"
gpui-kit = { version = "=0.8.0" }
# The code gutter metrics patch (vendor/gpui-base/PUPPYONE_PATCH.md).
gpui-base = { version = "=0.8.0" }
# GPUI Kit's tree-sitter highlighter for Markdown code blocks, with the
# grammars of the languages the product highlights
# (shared-ui/src/editor/code/codeLanguageSupport.ts; JSON comes with the base).
gpui-component = { version = "=0.8.0", features = ["tree-sitter-css", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-yaml", "tree-sitter-bash", "tree-sitter-toml", "tree-sitter-sql"] }
async-channel = "2"
anyhow = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
unicode-segmentation = "1"
unicode-normalization = "0.1"
unicode-linebreak = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cap-std = "3.4"
blake3 = "1.8"
uuid = { version = "1", features = ["v4"] }
semver = "1"
portable-pty = "0.9"
vt100 = "0.15"
vte = "0.11"
pulldown-cmark = "0.13"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
# Telemetry's rotating anonymous IDs (src/platform/telemetry/store.rs).
hmac = "0.12"
# Local Agent activation: reading the official CLI archives (validated and
# written by src/platform/local_agent_setup/installer.rs, never unpacked by the crate).
tar = { version = "=0.4.46", default-features = false }
flate2 = "1.1"
zeroize = "1"
httparse = "1"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
icu_collator = "=2.3.0"
icu_normalizer = "=2.3.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# The Electron product's localStorage (Chromium LevelDB) for the first-launch import.
rusty-leveldb = { version = "=4.0.2" }
regex = "1.13.1"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
# Feedback screenshots: sniffed, decoded and re-encoded (src/platform/feedback.rs).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "=0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString", "NSObject"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Real Core Text shaping for the frame-cost benchmarks (src/bench.rs); the
# same crate GPUI Kit's macOS platform uses, pinned with it.
gpui-pre-apple = { version = "=0.3.9", features = ["font-kit"] }

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
tempfile = "3"

[features]
# Opt-in developer captures (screenshots, editor geometry dumps, visual
# fixtures); absent from normal builds.
dev-capture = []

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
# The product code gutter (CodeMirror `.cm-lineNumbers` / `.cm-foldGutter`);
# see vendor/gpui-base/PUPPYONE_PATCH.md.
gpui-base = { path = "vendor/gpui-base" }
