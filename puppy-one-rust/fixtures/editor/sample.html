<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quarterly report</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 40px; color: #1f2933; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    .lede { color: #52606d; font-size: 17px; }
    .cards { display: flex; gap: 16px; margin-top: 24px; }
    .card { flex: 1; padding: 16px; border-radius: 12px; background: #f0f4f8; }
  </style>
</head>
<body>
  <h1>Quarterly report</h1>
  <p class="lede">Revenue grew across every region this quarter.</p>
  <div class="cards">
    <div class="card"><h2>North</h2><p>Up 12% on the previous quarter.</p></div>
    <div class="card"><h2>South</h2><p>Up 8% with two new partners.</p></div>
  </div>
</body>
</html>
