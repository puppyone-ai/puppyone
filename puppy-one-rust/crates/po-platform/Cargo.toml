[package]
name = "po-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
po-contracts = { path = "../po-contracts" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
blake3 = "1.8"
cap-std = "3.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
dirs = "=7.0.0"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.3"
hmac = "0.12"
# BMP and TIFF: pasted screenshots are converted to PNG (`feedback`).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
portable-pty = "0.9"
raw-window-handle = { version = "0.6", features = ["std"] }
regex = "1.13.1"
roxmltree = "=0.21.1"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["json", "stream", "rustls-tls", "macos-system-configuration"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
rusty-leveldb = { version = "=4.0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
tar = { version = "=0.4.46", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSGeometry", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString", "NSObject", "NSURL"] }
# CFNetwork proxy resolution (`platform::proxy`): the release already in the lockfile.
core-foundation-sys = "=0.8.7"

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "2.6"
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
test-support = ["po-contracts/test-support"]
dev-capture = []
