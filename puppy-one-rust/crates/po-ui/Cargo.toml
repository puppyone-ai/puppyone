[package]
name = "po-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
po-contracts = { path = "../po-contracts" }
po-platform = { path = "../po-platform" }
po-workspace = { path = "../po-workspace" }
anyhow = "1"
gpui-kit = { version = "=0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }
tempfile = "3"

[features]
dev-capture = ["gpui-kit/test-support", "po-platform/dev-capture", "po-workspace/dev-capture"]
test-support = ["po-platform/test-support", "po-workspace/test-support"]
