[package]
name = "po-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
po-contracts = { path = "../po-contracts" }
po-platform = { path = "../po-platform" }
async-channel = "2"
base64 = "0.22"
blake3 = "1.8"
cap-std = "3.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
encoding_rs = "=0.8.42"
futures-util = "0.3"
getrandom = "0.3"
httparse = "1"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
regex = "1.13.1"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
dev-capture = ["po-platform/dev-capture"]
test-support = ["po-platform/test-support"]
