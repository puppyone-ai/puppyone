      /* macOS draws these in the real app; the demo paints them in the same place. */

        position: fixed; top: 14px; left: 14px; z-index: 2147483647;
        display: flex; gap: 8px; pointer-events: none;

      .website-demo-traffic-lights i { width: 12px; height: 12px; border-radius: 50%; }
      .website-demo-traffic-lights i:nth-child(1) { background: #ff5f57; }
      .website-demo-traffic-lights i:nth-child(2) { background: #febc2e; }
