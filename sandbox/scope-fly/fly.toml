# Reference only. Scope-sandbox machines are created per-scope via the Machines
# API (see backend/.../fly_provider.py `_machine_config`), NOT `fly deploy`.
# This documents the equivalent machine shape and the raw-TCP :22 → :2222 map.
app = "puppyone-sandboxes"
primary_region = "sin"   # iad/hkg deprecated for new resources; sin validated

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 2222          # sshd (see Dockerfile ARG SSH_PORT)

  # Raw TCP 22 → sshd. Needs a dedicated IPv4 (fly ips allocate-v4); the shared
  # v4 only handles HTTP. No "http"/"tls" handlers — VSCode Remote-SSH speaks
  # plain SSH over the TCP socket.
  [[services.ports]]
    port = 22
    handlers = []

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

# auto_stop/auto_start are managed by the session manager + reaper (stop retains
# disk → fast resume via incremental fetch), so we DON'T set Fly autoscaling here.
